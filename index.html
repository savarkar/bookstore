<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PageTurner Books – Online Bookstore</title>
  <meta name="description" content="PageTurner Books: browse, search and buy books online.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#catalog">Skip to catalog</a>

  <header class="site-header">
    <div class="container header-inner">
      <a href="#" class="logo" aria-label="PageTurner Books home">Page<span>Turner</span></a>

      <form class="search" role="search" id="searchForm">
        <label for="searchInput" class="sr-only">Search books</label>
        <input type="search" id="searchInput" placeholder="Search title or author…" autocomplete="off">
      </form>

      <button class="cart-btn" id="cartBtn" aria-label="Open cart" aria-controls="cartDrawer" aria-expanded="false">
        Cart <span class="badge" id="cartCount">0</span>
      </button>
    </div>
  </header>

  <section class="hero">
    <div class="container">
      <h1>Find your next favourite read</h1>
      <p>Bestsellers, classics and hidden gems — delivered to your door.</p>
      <a class="btn" href="#catalog">Shop now</a>
    </div>
  </section>

  <main id="catalog" class="container">
    <div class="toolbar">
      <div class="chips" id="categoryChips" role="group" aria-label="Filter by category"></div>
      <div class="sort">
        <label for="sortSelect">Sort by</label>
        <select id="sortSelect">
          <option value="featured">Featured</option>
          <option value="price-asc">Price: low to high</option>
          <option value="price-desc">Price: high to low</option>
          <option value="rating">Top rated</option>
          <option value="title">Title A–Z</option>
        </select>
      </div>
    </div>

    <p class="result-count" id="resultCount" aria-live="polite"></p>
    <div class="grid" id="bookGrid"></div>
    <p class="empty" id="emptyMsg" hidden>No books match your search.</p>
  </main>

  <footer class="site-footer">
    <div class="container">© <span id="year"></span> PageTurner Books · Built with IBM Bob</div>
  </footer>

  <!-- Cart drawer -->
  <div class="overlay" id="overlay" hidden></div>
  <aside class="drawer" id="cartDrawer" aria-label="Shopping cart" aria-hidden="true">
    <div class="drawer-head">
      <h2>Your cart</h2>
      <button class="icon-btn" id="closeCart" aria-label="Close cart">&times;</button>
    </div>
    <ul class="cart-list" id="cartList"></ul>
    <div class="drawer-foot">
      <div class="total-row"><span>Total</span><strong id="cartTotal">$0.00</strong></div>
      <button class="btn block" id="checkoutBtn">Checkout</button>
    </div>
  </aside>

  <!-- Product modal -->
  <dialog id="bookDialog" class="dialog" aria-labelledby="dlgTitle">
    <button class="icon-btn dlg-close" id="closeDialog" aria-label="Close">&times;</button>
    <div class="dlg-body" id="dlgBody"></div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/app.js"></script>
</body>
</html>
